name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  # Unit, integration and CLI built-binary tests on every supported Node
  # (engines.node >=22), then a pack-and-run smoke test of the npm tarball.
  test-matrix:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: xvfb-run -a npm test

      # Builds the CLI, packs it as `npm publish` would, installs the tarball
      # into a temp dir and runs lhr --version, --help and an MCP handshake.
      - name: Smoke test the packed CLI
        run: npm run smoke:pack -w @pablou/lhr

  # Single required status check (the `main` ruleset requires `test`), so the
  # matrix can change without editing the ruleset.
  test:
    name: test
    needs: test-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        run: test "${{ needs.test-matrix.result }}" = success

  # End-to-end scenarios against approved output (packages/vscode/e2e).
  # Non-blocking while the suite proves itself stable on Linux.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    # The job takes ~2 min. Playwright's globalTimeout stops the suite at 4 so
    # results still upload; this caps install and setup on top. Raise both
    # as scenarios are added.
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run e2e scenarios
        run: xvfb-run -a npm run test:e2e

      - name: Upload e2e results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: packages/vscode/e2e-results/
          retention-days: 14

  release:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing (OIDC) for @pablou/lhr: no long-lived npm token.
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for semantic-release
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install Dependencies
        run: npm ci

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
